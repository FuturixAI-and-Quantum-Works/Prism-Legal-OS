name: prism-local

x-backend-environment: &backend-environment
  NODE_ENV: development
  PORT: "8003"
  DATABASE_URL: postgresql://prism:prism-local-db@postgres:5432/prism
  BETTER_AUTH_URL: http://localhost:8003
  FRONTEND_URL: http://localhost:8080
  OBJECT_STORE_ENDPOINT: http://minio:9000
  OBJECT_STORE_PUBLIC_ENDPOINT: http://localhost:9000
  OBJECT_STORE_FORCE_PATH_STYLE: "true"
  OBJECT_STORE_ACCESS_KEY_ID: prism
  OBJECT_STORE_SECRET_ACCESS_KEY: prism-local-minio
  OBJECT_STORE_BUCKET: prism
  PRISM_SECRETS_FILE: /app/secrets/prism.env
  QDRANT_URL: http://qdrant:6333
  RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
  MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

x-backend-service: &backend-service
  image: prism-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: *backend-environment
  volumes:
    - prism_secrets:/app/secrets
  shm_size: 1gb
  restart: unless-stopped
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism-local-db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    stop_grace_period: 30s

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: prism
      MINIO_ROOT_PASSWORD: prism-local-minio
      MC_HOST_local: http://prism:prism-local-minio@localhost:9000
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/prism"]
    environment:
      MC_HOST_local: http://prism:prism-local-minio@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-service
    command: ["/bin/sh", "-c", "node dist/scripts/setup.js && exec node dist/index.js"]
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8003/health').then(async r=>{if(!r.ok||!(await r.json()).ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *backend-service
    command: ["node", "dist/worker.js"]
    environment:
      <<: *backend-environment
      HEALTHCHECK_API_URL: http://backend:8003/health
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '^node dist/worker[.]js$$' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    image: prism-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8003
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  prism_secrets:
